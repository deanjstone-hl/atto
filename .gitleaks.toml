# The scrub rules for this repository (atto1/104, atto1/108): gitleaks' default rules plus personal-data
# rules, so the public tree holds no private value. Run `bash scripts/scrub-scan.sh`; it exits
# non-zero on a hit and never prints a value. Private values live in Bitwarden Secrets
# Manager and reach the Worker at deploy time (docs/public-cutover.md).
title = "atto1 scrub rules"

[extend]
useDefault = true

[[rules]]
id = "personal-email"
description = "An email address (a placeholder at example.com, example.org or a GitHub noreply address is fine)"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}\b'''
keywords = ["@"]

[[rules]]
id = "tailnet-hostname"
description = "A Tailscale MagicDNS hostname"
regex = '''[a-z0-9-]+\.ts\.net\b'''
keywords = ["ts.net"]

[[rules]]
id = "tailnet-ip"
description = "A Tailscale CGNAT address (100.64.0.0/10)"
regex = '''\b100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
keywords = ["100."]

[[rules]]
id = "lan-ip"
description = "A private LAN address (192.168/16, 10/8, 172.16/12)"
regex = '''\b(?:192\.168\.[0-9]{1,3}\.[0-9]{1,3}|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})\b'''
keywords = ["192.168.", "10.", "172."]

[[rules]]
id = "au-mobile"
description = "An Australian mobile number"
regex = '''(?:\+61|\b0)[ -]?4[0-9]{2}[ -]?[0-9]{3}[ -]?[0-9]{3}\b'''
keywords = ["04", "+61"]

[[rules]]
id = "access-team-domain"
description = "A Cloudflare Access team domain (the team name is private)"
regex = '''[a-z0-9-]+\.cloudflareaccess\.com\b'''
keywords = ["cloudflareaccess.com"]

[[rules]]
id = "cloudflare-id"
description = "A 32 or 64 character hex id (account, zone, Access audience, policy group) or a UUID (D1 database id, Access user id)"
regex = '''\b(?:[0-9a-f]{64}|[0-9a-f]{32}|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''

[[allowlists]]
description = "Placeholders and addresses that identify no one"
regexes = [
  '''@example\.(?:com|org|net|invalid|test)\b''',
  '''@(?:byd\.com|oaic\.gov\.au)\b''',
  '''@users\.noreply\.github\.com\b''',
  '''noreply@(?:github|anthropic)\.com\b''',
  '''^ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860$''',
  '''^(?:owner|team|evil|example)\.cloudflareaccess\.com$''',
  # Synthetic ids in fixtures and tests: all zeros, counting, or a repeated pattern.
  '''^[0-9a-f]0000000-0000-4000-[0-9a-f]{4}-[0-9a-f]{12}$''',
  '''^5f3c9a2e-1111-4222-8333-444455556666$''',
  '''^0123456789abcdef0123456789abcdef$''',
  '''^(?:a1b2c3d4e5f60718293a4b5c6d7e8f90){1,2}$''',
  # Cloudflare API permission-group ids named in scripts/owner-steps/83.sh: the same for every
  # account (GET /user/tokens/permission_groups), so they identify no one.
  '''^(?:1e13c5124ca64b72b1969a67e8829049|7ea222f6d5064cfa89ea366d7c1fee89|a1c0fec57cf94af79479a6d827fa518c|91f7ce32fa614d73b7e1fc8f0e78582b)$''',
]
paths = [
  '''pnpm-lock\.yaml$''',
  '''scripts/ci/release-scripts\.lock$''',
  '''scripts/heavy-lock\.lock$''',
  '''\.gitleaks\.toml$''',
]

# The vendored links registry (frontend ADR-0004, atto/14) lists the tailnet services' host. The
# registry is published in the public frontend repo, so the two vendored copies add nothing new
# to the tree; no other file may name a tailnet host.
[[allowlists]]
description = "The tailnet host in the vendored links registry"
targetRules = ["tailnet-hostname"]
paths = [
  '''(?:^|/)links\.json$''',
  '''(?:^|/)src/lib/links\.ts$''',
]

# A Secrets Manager secret id on a bitwarden/sm-action map line in deploy.yml (atto/10): an id names a
# secret and reads nothing without the machine account's token. gitleaks matches the whole line, so
# the id is allowed only as `<uuid> > <ENV_NAME>` and nowhere else.
[[allowlists]]
description = "Secrets Manager ids in the sm-action map"
regexTarget = "line"
regexes = [
  '''^\s+[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12} > [A-Z][A-Z0-9_]+$''',
]
