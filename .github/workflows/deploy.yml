name: Deploy

# ADR-004: atto1 changes production only from the deploy branch. A merge to main deploys
# nothing; scripts/promote.sh (or the owner's approval on the ops hub) moves deploy, and this
# workflow then applies the D1 migrations and deploys the Worker, the same two package.json
# scripts the owner ran by hand (argus-config#1048, atto1#58). Those scripts stay as
# break-glass. Workers have no branch previews, so there is deliberately no pull_request
# trigger: `wrangler deploy` from a PR would ship unreviewed code to the production Worker.
#
# One target, so no path filter: every promotion runs the migrate and deploy, both idempotent.
# A push whose head commit carries the skip-CI marker runs no workflow. promote.sh refuses
# such a commit, and docs/deploy-branch.md says how to recover with workflow_dispatch.
#
# The ops hub's "Roll back" card (argus#1178) dispatches this workflow at a release tag
# (`vX.Y.Z`) to redeploy an earlier version without moving `deploy`. The job's checkout is
# then that tag, and scripts/require-deploy-checkout.sh (told the tag in DEPLOY_ROLLBACK_TAG)
# accepts it only if `deploy` already held that commit. A dispatch from a branch is still
# refused. The D1 migrations step runs too: at an older tag it finds nothing new to apply.
# A rollback works only for a release cut after this change, since an older tag carries the
# old workflow, which skips the dispatch.
#
# Secrets (atto/10, the pilot of argus-config/1418): every value the deploy needs comes from Bitwarden
# Secrets Manager through bitwarden/sm-action, pinned by full commit SHA (v3.0.1), with the one Actions
# secret BWS_ACCESS_TOKEN: the token `github-actions` of the machine account `actions-read`, which has
# Can read on the `actions` project only. The action looks a secret up by id, so the map below pairs each
# id with its environment variable, in this one place. It exports them as masked environment variables
# to the steps after it, and the only steps after it are the two that call wrangler. The repository is
# public, so none of those values is in it: scripts/render-wrangler.ts fills the placeholders in
# wrangler.jsonc from the environment and writes the gitignored config wrangler reads. It has no
# pull_request trigger, so a fork's pull request never reaches the token or the secrets.

on:
  push:
    branches: [deploy]
  workflow_dispatch:

concurrency:
  group: deploy-atto1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy atto1 Worker
    # A manual dispatch from main (or any other ref) would deploy unpromoted code. A release
    # tag is the one other ref: the rollback card's dispatch, whose commit the checkout guard
    # then requires `deploy` to have held.
    if: >-
      github.ref == 'refs/heads/deploy'
      || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Wrangler is a global tool, not a dependency (ADR-002), and the package.json scripts
      # call it by name. Install it beside the job, not into the host, and put it on PATH.
      - name: Install wrangler
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler"
          echo '{"private":true}' > "$RUNNER_TEMP/wrangler/package.json"
          pnpm --dir "$RUNNER_TEMP/wrangler" add wrangler@4.156.0 --allow-build=esbuild --allow-build=workerd
          echo "$RUNNER_TEMP/wrangler/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Typecheck and lint
        run: pnpm run typecheck && pnpm run lint

      - name: Test
        run: pnpm run test

      # The values below are what scripts/render-wrangler.ts and wrangler need; every one is a key of the
      # `actions` project in Secrets Manager (id on the left, environment variable on the right):
      #   ATTO_D1_DATABASE_ID        the D1 database id
      #   ATTO_ACCESS_TEAM_DOMAIN    the Cloudflare Access team domain
      #   ATTO_ACCESS_AUD            the Access application's audience tag
      #   ATTO_INGEST_CLIENT_ID      the BYD collector's Access service token (Client ID)
      #   ATTO_INGEST_OWNER_SUBJECT  the owner's Access user id
      #   ATTO_TRIGGER_CLIENT_ID     the phone's CarPlay Access service token (Client ID)
      #   CLOUDFLARE_API_TOKEN       wrangler's API token (the key ATTO_CLOUDFLARE_API_TOKEN, a copy of ci-deploy-atto1)
      #   CLOUDFLARE_ACCOUNT_ID      the Cloudflare account id (the key ATTO_CLOUDFLARE_ACCOUNT_ID)
      # wrangler reads the last two by those names, so the variable drops the ATTO_ prefix of its key.
      # Placed last before wrangler so only the two steps below it see the values. A key with no
      # secret behind its id makes this step fail, before anything changes.
      - name: Read the deploy values from Secrets Manager
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            fd719060-b73b-45a8-b2c1-b5070178879b > ATTO_D1_DATABASE_ID
            f14784cb-bd99-4724-93be-b50701788914 > ATTO_ACCESS_TEAM_DOMAIN
            adad0a7d-5579-40ae-a426-b50701788b0e > ATTO_ACCESS_AUD
            3c1ecf4c-60e9-430a-8b09-b50701788cc6 > ATTO_INGEST_CLIENT_ID
            d4a02a35-2a12-41de-b518-b50701788e3e > ATTO_INGEST_OWNER_SUBJECT
            593a8c42-7d28-49c4-8744-b509000033c0 > ATTO_TRIGGER_CLIENT_ID
            d5ef370a-5738-4e13-9de0-b50900a40e86 > CLOUDFLARE_API_TOKEN
            33229ee9-c727-4258-a9ea-b50900a40fbb > CLOUDFLARE_ACCOUNT_ID

      # Both scripts start with scripts/require-deploy-checkout.sh: they refuse unless this
      # checkout is exactly what origin/deploy holds. If deploy moved on since this run
      # started, they stop, and the newer run deploys.
      - name: Apply D1 migrations
        run: pnpm run db:migrate
        env:
          # Set only for a rollback; empty means the guard wants HEAD to be `deploy` itself.
          DEPLOY_ROLLBACK_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Deploy the Worker
        run: pnpm run deploy
        env:
          # Set only for a rollback; empty means the guard wants HEAD to be `deploy` itself.
          DEPLOY_ROLLBACK_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
