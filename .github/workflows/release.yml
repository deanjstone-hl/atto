name: Release

# atto1#65 (argus-config#1048): a version is cut when the owner promotes, one per push to
# `deploy`, never by a merge to `main`. A promotion made only of chore/docs/ci commits
# releases nothing: semantic-release finds no releasable commit and exits 0.
#
# The job does not read github.event.commits to decide whether to run. A push event lists
# 20 commits at most and a promotion can ship more, so a filter could skip a promotion that
# holds a feat. semantic-release reads the real history between the last tag and HEAD.
#
# semantic-release only analyses, tags and publishes the GitHub Release (.releaserc.json).
# It commits nothing back: `deploy` is fast-forwarded from `main`, so a commit made here
# would fork the branches. The changelog is the GitHub Release notes.
#
# The workflow sits beside deploy.yml, not in it, so a failed deploy does not hide a
# release and a failed release does not undo a deploy. A tag made with GITHUB_TOKEN starts
# no other workflow.

on:
  push:
    branches: [deploy]
  # Manual retry: a release whose run failed is not retried by the next promotion, which
  # only tags what is new since the last tag. Dispatch it on deploy instead.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# One release at a time, never cancelled midway: two promotions in quick succession release in
# order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Test before release (argus-config#1167, #1198, atto1#70). The promoted SHA is already on
  # main, so this job first asks whether anything would ship, then whether main's CI already
  # proved the SHA: a `CI` run on main from a push (the whole `pnpm run check`, never a subset)
  # passed, and every other main run on the SHA is green (scripts/ci/release-proof.sh, vendored from
  # argus-config, configured by the RELEASE_PROOF_* env below). A red
  # main run fails this job, so a red SHA never releases. When main has no green full run of
  # the SHA yet, the next job runs the check here instead.
  gate:
    name: Test before release (main CI on this SHA)
    # A manual dispatch from main (or any other ref) would tag unpromoted code.
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.anything.outputs.release }}
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # semantic-release publishes only for feat/fix/perf/revert or a breaking change (the
      # default commit-analyzer). Most promotions carry none, and then there is nothing for a
      # test to gate: no test runs and no version is cut. A promotion can carry more commits
      # than a push event lists (GitHub truncates the list), so this reads git, never the event.
      - name: Anything to release?
        id: anything
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          range="${last:+$last..}HEAD"
          if [ -z "$last" ] \
             || git log "$range" --format=%s | grep -qE '^((feat|fix|perf|revert)(\(.+\))?!?:|Revert )' \
             || git log "$range" --format=%B | grep -q 'BREAKING CHANGE'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing releasable since $last: no test, no release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Did main's CI already test this SHA in full?
        id: proof
        if: steps.anything.outputs.release == 'true'
        run: bash scripts/ci/release-proof.sh
        env:
          GH_TOKEN: ${{ github.token }}
          # atto1's whole test is the `CI` workflow; no required jobs, so that run's own
          # success counts (the vendored script reuses nothing when this is unset).
          RELEASE_PROOF_WORKFLOW: CI

  # The fallback: the same `pnpm run check` workers run before every push and ci.yml runs on a
  # push to main, on the promoted SHA.
  test:
    name: Test before release (bats, lint, build and typecheck, unit tests)
    needs: gate
    if: >-
      github.ref == 'refs/heads/deploy'
      && needs.gate.outputs.release == 'true'
      && needs.gate.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # github.sha: the commit that was promoted (or the tip of deploy for a manual run).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

  release:
    name: Release
    needs: [gate, test]
    # Runs only after a passing test: main's green full run of this SHA (reuse) or the check
    # run above. `!cancelled()` lets it run when `test` was skipped for reuse.
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/deploy'
      && needs.gate.result == 'success'
      && needs.gate.outputs.release == 'true'
      && (needs.test.result == 'success'
          || (needs.test.result == 'skipped' && needs.gate.outputs.reuse == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Up to 3 attempts, each from the remote tip of deploy: a second promotion landing
      # mid-run would otherwise make semantic-release exit 0 having released nothing.
      - name: Release
        run: bash scripts/ci/release-with-retry.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: deploy
