name: CI

# Trunk-based development (argus-config#1176): agents push straight to main, and every push
# runs the same `pnpm run check` they ran locally before pushing. No push is skipped by its
# commit subject: the squash-merge guard (argus-config#1173) is gone with the PR flow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per PR, one per main commit. Never ${{ github.ref }}: a group holds one
  # pending run, so on main the next push would cancel this commit's queued run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The release scripts in scripts/ci are vendored from argus-config and synced, never
      # edited here (argus-config#1269): this fails on a hand-edited copy.
      - name: Release scripts match their lock
        run: bash scripts/ci/release-scripts-check.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # scripts/check.sh: bats on the release wrapper, lint, build (tsc -b && vite build, so
      # the typecheck too) and test with NODE_ENV pinned to test. The homelab runners have
      # bats from apt; elsewhere the script fetches the same version.
      - name: Check
        run: pnpm run check
