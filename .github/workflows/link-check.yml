name: Link check
# link-check:vendored

# Bans hand-written myargus.cc and tailnet host literals in code, and checks the
# repo's host and path config against links.json. Shipped by the frontend
# `link-check` registry item (ADR-0004).
#
# LINK_CHECK_MODE is `block`: the job fails on any finding. It started at `report`
# (the baseline, decision 10) and flipped when this repo's report read 0 (atto/14).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: Link check
    runs-on: ubuntu-latest
    env:
      LINK_CHECK_MODE: block
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check links
        run: bash scripts/link-check.sh
